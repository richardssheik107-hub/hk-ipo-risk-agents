# v0.4.5 Competition runtime, offline.
#
# Identical to configs/v04_offline.yaml except for the Final Supervisor: the E
# lane's LLM Supervisor keeps the frozen PR-G composition as its spine and adds
# deterministic conflict detection, one bounded targeted re-check and Agent /
# Tool / Evidence trace assembly.  With llm_provider: unavailable the synthesis
# degrades honestly and everything else still runs, so this config is the
# reproducible offline reference for the competition product.
workflow_version: enhanced_v2
runtime_mode: offline
use_mock: false
enable_verifier: true
parser: pymupdf
retriever: hybrid_bm25
financial_agent: v03
legal_agent: v03
business_agent: v03
market_agent: disabled
verifier: specialized_v03
supervisor: v03
predictor: rule_based
llm_provider: unavailable
market_data_provider: unavailable
ipo_data_provider: catalog
repository: json
report_generator: v04
data_dir: data
report_dir: reports
log_level: INFO

market_context: governed_pr_b_core
market_feature_dir: reports/v04_pr_b/core_features
market_official_bridge: data/catalog/ipo_official_master_bridge.csv
# Any legal prospectus outside the frozen 438 recomputes Market-X Core from the
# committed prior-IPO universe under the same strictly pre-listing cutoff.
# Prior-IPO outcomes come from licensed EOD, so that tier stays an optional
# local pack: set IPO_RISK_MARKET_DYNAMIC_OUTCOME_PACK once it is materialized.
market_dynamic_context: pit_bridge
# Generalized frozen-model inference for every case outside the per-case handoff.
model_dynamic_runtime: frozen_v2
market_dynamic_outcome_pack: ""
# Market-X Extended (HSI / HKEX turnover) for non-frozen cases. The CSMAR and
# HKEX caches are licensed and stay out of Git; set both env vars locally.
# Industry returns remain INDUSTRY_MAPPING_PIT_BLOCKED either way.
market_dynamic_extended_hsi_csv: ""
market_dynamic_extended_turnover_csv: ""
final_supervisor: llm
# The V2 handoff is label-free and bound to its versioned freeze/receipt. The
# previous PR-F package remains committed for rollback and audit.
pr_f_run_dir: reports/v045_role_d_v2_product_handoff_final3

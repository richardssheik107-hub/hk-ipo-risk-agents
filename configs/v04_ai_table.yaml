# v0.4 workflow on the opt-in table document path.
# Identical to v04_ai.yaml except for the two document-intelligence
# components: the borderless-table parser and the structured-first financial
# extractor. Kept as a separate file so v04_ai.yaml keeps its frozen
# behaviour and the two can be compared on the same workflow.
workflow_version: enhanced_v2
runtime_mode: ai_enhanced
use_mock: false
enable_verifier: true
parser: pymupdf_table
retriever: keyword
financial_agent: v03
financial_extractor: table
legal_agent: v03
business_agent: v03
market_agent: disabled
verifier: specialized_v03
supervisor: v03
predictor: rule_based
llm_provider: openai_compatible
market_data_provider: unavailable
ipo_data_provider: catalog
repository: json
report_generator: v04
data_dir: data
report_dir: reports
log_level: INFO

# PR-H runtime channels. The governed market view reads only the frozen PR-B
# product projection; the legacy market-data snapshot remains unavailable.
market_context: governed_pr_b_core
market_feature_dir: reports/v04_pr_b/core_features
market_official_bridge: data/catalog/ipo_official_master_bridge.csv
final_supervisor: v04
# Set IPO_RISK_PR_F_RUN_DIR to a local sanitized handoff. It stays empty in Git.
pr_f_run_dir: ""

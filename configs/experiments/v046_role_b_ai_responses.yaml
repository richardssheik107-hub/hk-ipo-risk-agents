# Opt-in v0.4.6 Role-B ablation profile; not a shipped UI runtime scenario.
#
# This file is intentionally isolated from the competition runtime.  Market and
# Final-Supervisor LLM channels are disabled so only the four frozen Role-B
# structured tasks may be routed by the ablation harness.  Credentials and the
# licensed prospectus root remain environment-only.
workflow_version: enhanced_v2
runtime_mode: ai_enhanced
use_mock: false
enable_verifier: true
parser: pymupdf
retriever: role_b_v046_financial_high_recall
financial_agent: v03
financial_extractor: regex
legal_agent: v03
business_agent: v03
market_agent: disabled
verifier: specialized_v03
supervisor: v03
predictor: rule_based
llm_provider: openai_responses
llm_model: ark-code-latest
llm_timeout_seconds: 300
llm_max_retries: 1
market_data_provider: unavailable
ipo_data_provider: catalog
repository: json
report_generator: v04
data_dir: data
report_dir: reports
log_level: INFO
market_context: none
final_supervisor: none
pr_f_run_dir: ""

# load_settings intentionally ignores this machine-readable experiment block;
# the opt-in v0.4.6 runner consumes it when binding journal identity/provenance.
role_b_ablation_profile:
  profile_version: v046_role_b_ablation_v1
  default_modes:
    - offline
    - shadow
    - gated
  transport: responses
  max_transport_attempts_per_structured_attempt: 2
  max_structured_attempts: 2
  max_network_calls_per_task: 4
  smoke_required_before_fixed10: true
  validation_enabled: false
  blind_2025_enabled: false
  allowed_tasks:
    - shareholder_rights_extract
    - litigation_compliance_extract
    - business_precommercial_commercialization_extract
    - business_precommercial_core_product_extract
  prompt_versions:
    shareholder_rights_extract: legal_shareholder_rights_v1
    litigation_compliance_extract: legal_litigation_compliance_v1
    business_precommercial_commercialization_extract: business_precommercial_v1
    business_precommercial_core_product_extract: business_precommercial_v1

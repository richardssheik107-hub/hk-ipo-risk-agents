# v0.4.5 Competition runtime, AI enhanced.
#
# The full competition chain: governed Market Intelligence, LLM Legal/Business
# semantics, deterministic conflict detection, one bounded targeted re-check and
# the LLM Final Supervisor.  The LLM interprets and synthesises governed facts
# only; it never mints a risk, an Evidence id, a market value or a probability,
# and every stage degrades to its deterministic result when the provider is
# unavailable.
workflow_version: enhanced_v2
runtime_mode: ai_enhanced
use_mock: false
enable_verifier: true
parser: pymupdf
retriever: hybrid_bm25
financial_agent: v03
legal_agent: v03
business_agent: v03
market_agent: market_intelligence
verifier: specialized_v03
supervisor: v03
predictor: rule_based
# Keep the frozen competition default on the acceptance-tested Responses path.
# Environment variables have precedence, so a separately validated demo runtime
# may opt into openai_compatible without mutating the frozen config identity.
llm_provider: openai_responses
llm_timeout_seconds: 300
llm_max_retries: 0
market_data_provider: unavailable
ipo_data_provider: catalog
repository: json
report_generator: v04
data_dir: data
report_dir: reports
log_level: INFO

market_context: governed_pr_b_core
market_feature_dir: reports/v04_pr_b/core_features
market_official_bridge: data/catalog/ipo_official_master_bridge.csv
final_supervisor: llm
# The V2 handoff is label-free and bound to its versioned freeze/receipt. The
# previous PR-F package remains committed for rollback and audit.
pr_f_run_dir: reports/v045_role_d_v2_product_handoff_final3

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-ipo-risk-agents"
version = "0.2.0"
description = "Evidence-driven multi-agent Hong Kong IPO risk analysis MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0", "langgraph>=0.2", "streamlit>=1.35", "PyMuPDF>=1.24", "openpyxl>=3.1", "openai>=1.40,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

name: expert-annotation-phase2

on:
  push:
    branches: [agent/expert-annotation-phase2]
  pull_request:
    branches: [main, agent/expert-annotation-phase1-audit]

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Phase-1 and Phase-2 audit tests
        run: pytest -q tests/unit/test_annotation_audit.py tests/unit/test_annotation_phase2.py
      - name: Run Phase-2 correction and triage
        run: python scripts/run_expert_annotation_phase2.py
      - name: Verify pass1 artifacts were not modified
        run: git diff --exit-code -- 'expert_results/ipo_*/pass1/expert_annotation_v1.json'
      - name: Verify deterministic correction artifacts are reproducible
        run: git diff --exit-code -- 'expert_results/ipo_*/audit/deterministic_corrections_v1.json'
      - name: Byte-compile Phase-2 modules
        run: python -m compileall -q src/ipo_risk/quality scripts/run_expert_annotation_phase2.py
      - name: Upload Phase-2 queues
        uses: actions/upload-artifact@v4
        with:
          name: expert-annotation-phase2
          path: reports/annotation_audit/phase2/

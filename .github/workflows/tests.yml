name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-v2-model-artifact-integrity:
    name: Windows V2 model artifact integrity
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify V2 model checkout attributes
        shell: pwsh
        run: |
          $autocrlf = git config --get core.autocrlf
          if ($LASTEXITCODE -ne 0) {
            $autocrlf = "<unset>"
          }
          Write-Host "core.autocrlf=$autocrlf"

          $attribute = git check-attr text -- models/role_d_v2/model.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve Git attributes for model.txt"
          }
          Write-Host $attribute
          if ($attribute -notmatch ": text: unset$") {
            throw "model.txt is not protected by -text: $attribute"
          }
      - name: Verify V2 model raw SHA-256
        shell: pwsh
        run: |
          $expected = "320e810e85dcdb7e6caa40f9ef2b20157005e7a1d1af38ad7d586dd0feee72e2"
          $actual = (Get-FileHash models/role_d_v2/model.txt -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "V2 model raw SHA mismatch: expected=$expected actual=$actual"
          }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,retrieval-research]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Byte-compile
        run: python -m compileall -q app src scripts
      - name: Project structure validation
        run: python scripts/validate_project.py
      - name: Competition data validation
        run: python scripts/validate_competition_data.py
      - name: Competition runtime contract validation
        run: python scripts/validate_competition_runtime.py
      - name: Role-D recorded materialization receipt
        run: python scripts/validate_v045_role_d_receipt.py
      - name: Submission readiness fail-closed smoke
        run: >-
          python scripts/build_v045_submission_readiness.py
          --output-dir "$RUNNER_TEMP/v045_submission_readiness"
      - name: Golden-case manifest integrity
        run: >-
          python scripts/validate_v03_golden_manifest.py
          tests/fixtures/v03_golden_cases/v03_golden_case_manifest.csv --integrity
      - name: v0.3 batch + evaluation smoke (mock, no PDFs)
        run: |
          python scripts/run_v03_batch_analysis.py \
            --case-ids ipo_2020_00368,ipo_2020_00589 \
            --output-dir "$RUNNER_TEMP/v03_batch"
          python scripts/evaluate_v03_golden_cases.py \
            --results "$RUNNER_TEMP/v03_batch/analysis_results.jsonl" \
            --golden-manifest tests/fixtures/v03_golden_cases/v03_golden_case_manifest.csv \
            --output-dir "$RUNNER_TEMP/v03_eval"
